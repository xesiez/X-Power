name: X-Power Foundation Build
on:
  push:
    branches: [ main, foundation-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build UWP x64
        shell: pwsh
        run: msbuild .\XPower.sln /m /p:Configuration=Release /p:Platform=x64 /p:AppxPackage=false /p:GenerateAppxPackageOnBuild=false /verbosity:minimal
